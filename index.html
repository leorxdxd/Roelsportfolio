    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <script>
      // Light theme by default; dark only if the visitor chose it with the toggle.
      // Runs before the page paints to prevent a flash.
      (function () {
        var t = "light";
        try {
          if (localStorage.getItem("theme") === "dark") t = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <!-- Hidden static copy of the contact form so Netlify Forms can detect it at deploy time.
         The visible form is rendered by React (src/components/Contact.tsx); keep field names in sync. -->
